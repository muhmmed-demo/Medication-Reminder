name: medication_reminder
description: "A highly reliable, offline-first medication reminder and full-screen alarm application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local Notification & Exact AlarmClock full-screen intent
  flutter_local_notifications: ^18.0.1

  # Local SQLite ORM
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  path: ^1.9.0

  # System Permissions
  permission_handler: ^11.3.1

  # State Management & Architecture
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  get_it: ^8.0.3

  # Audio Alarm, Volume & Vibration
  audioplayers: ^6.1.1
  vibration: ^3.1.2
  flutter_tts: ^4.2.2
  perfect_volume_control: ^0.2.0

  # Camera & Images (Pill Identification)
  image_picker: ^1.1.2

  # Date, Time & Timezones
  intl: ^0.20.3
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0

  # Device detection for OEM battery optimization guidance
  device_info_plus: ^11.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
