name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Backup Custom Files
        run: |
          mkdir -p backup_custom
          if [ -d "android" ]; then
            cp -r android backup_custom/
            rm -rf android
          fi

      - name: Generate Android Scaffolding
        run: |
          flutter create --platforms=android --project-name medication_reminder --org com.example /tmp/template_app
          cp -r /tmp/template_app/android ./android
          rm -rf /tmp/template_app

      - name: Restore Custom Files
        run: |
          if [ -d "backup_custom/android/app" ]; then
            cp -f backup_custom/android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            mkdir -p android/app/src/main/res/raw
            mkdir -p android/app/src/main/res/drawable
            cp -r backup_custom/android/app/src/main/res/* android/app/src/main/res/
            cp -f backup_custom/android/app/proguard-rules.pro android/app/proguard-rules.pro
          fi
          rm -rf backup_custom

      - name: Enable Core Library Desugaring
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/g' android/app/build.gradle.kts
            echo 'dependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4") }' >> android/app/build.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileOptions {/compileOptions {\n        coreLibraryDesugaringEnabled true/g' android/app/build.gradle
            echo 'dependencies { coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4" }' >> android/app/build.gradle
          fi
          echo "=== ANDROID APP BUILD GRADLE ==="
          cat android/app/build.gradle* || true
          echo "================================="

      - name: Install Dependencies
        run: |
          flutter pub get 2>&1 | tee pub_get.log || {
            echo "### Flutter Pub Get Error Log:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat pub_get.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Generate Database Code (Drift)
        run: |
          dart run build_runner build --delete-conflicting-outputs 2>&1 | tee build_runner.log || {
            echo "### Build Runner Error Log:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build_runner.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build_apk.log || {
            echo "================ FLUTTER BUILD ERROR ================"
            cat build_apk.log | tail -n 120
            echo "====================================================="
            echo "### Flutter Build APK Error Log:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 build_apk.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Locate and Collect Built APK
        run: |
          mkdir -p apk_output
          find . -name "*.apk" -exec cp {} apk_output/ \;
          echo "### Collected APKs:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la apk_output/ | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: Medication-Reminder-APK
          path: apk_output/*.apk
          if-no-files-found: error
