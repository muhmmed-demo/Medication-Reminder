name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter version
        run: flutter --version

      # ─── Backup & Scaffold ────────────────────────────────────────────────
      - name: Backup Custom Android Files
        run: |
          mkdir -p backup_custom
          if [ -d "android" ]; then
            cp -r android backup_custom/
            rm -rf android
          fi

      - name: Generate Fresh Android Scaffolding
        run: |
          flutter create --platforms=android \
            --project-name medication_reminder \
            --org com.example \
            /tmp/template_app
          cp -r /tmp/template_app/android ./android
          rm -rf /tmp/template_app

      - name: Restore Custom Android Files
        run: |
          if [ -d "backup_custom/android/app" ]; then
            # AndroidManifest
            cp -f backup_custom/android/app/src/main/AndroidManifest.xml \
                  android/app/src/main/AndroidManifest.xml

            # Resources (mipmap icons, drawables, sounds)
            mkdir -p android/app/src/main/res/raw
            mkdir -p android/app/src/main/res/drawable
            cp -rf backup_custom/android/app/src/main/res/* \
                   android/app/src/main/res/

            # Proguard rules
            cp -f backup_custom/android/app/proguard-rules.pro \
                  android/app/proguard-rules.pro

            # Custom Kotlin sources (MainActivity.kt + any other classes)
            if [ -d "backup_custom/android/app/src/main/kotlin" ]; then
              mkdir -p android/app/src/main/kotlin
              cp -rf backup_custom/android/app/src/main/kotlin/* \
                     android/app/src/main/kotlin/
            fi
          fi
          rm -rf backup_custom

      # ─── Patch Gradle Files ────────────────────────────────────────────────
      - name: Patch app build.gradle - compileSdk 36 + Core Desugaring
        run: |
          # Detect Kotlin DSL vs Groovy DSL
          APP_GRADLE=""
          if [ -f "android/app/build.gradle.kts" ]; then
            APP_GRADLE="android/app/build.gradle.kts"

            # Raise compileSdk to 36 (handles both flutter.compileSdkVersion and hardcoded values)
            sed -i \
              -e 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/g' \
              -e 's/compileSdkVersion(flutter\.compileSdkVersion)/compileSdk = 36/g' \
              -e 's/compileSdk = [0-9]*/compileSdk = 36/g' \
              "$APP_GRADLE"

            # Enable Core Library Desugaring
            sed -i \
              's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/g' \
              "$APP_GRADLE"

            # Append desugaring dependency
            printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n' \
              >> "$APP_GRADLE"

          elif [ -f "android/app/build.gradle" ]; then
            APP_GRADLE="android/app/build.gradle"

            sed -i \
              -e 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/g' \
              -e 's/compileSdk flutter\.compileSdkVersion/compileSdk 36/g' \
              -e 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' \
              -e 's/compileSdk [0-9]*/compileSdk 36/g' \
              "$APP_GRADLE"

            sed -i \
              's/compileOptions {/compileOptions {\n        coreLibraryDesugaringEnabled true/g' \
              "$APP_GRADLE"

            printf '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"\n}\n' \
              >> "$APP_GRADLE"
          fi

          echo "=== PATCHED APP BUILD GRADLE ==="
          cat "$APP_GRADLE" || true
          echo "================================="

      # ─── Dependencies & Code Generation ───────────────────────────────────
      - name: Install Flutter Dependencies
        run: |
          flutter pub get 2>&1 | tee pub_get.log || {
            echo "### Pub Get Error:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat pub_get.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Generate Database Code (Drift)
        run: |
          dart run build_runner build --delete-conflicting-outputs 2>&1 | tee build_runner.log || {
            echo "### Build Runner Error:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build_runner.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      # ─── Build ─────────────────────────────────────────────────────────────
      - name: Build Release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build_apk.log || {
            echo "================ FLUTTER BUILD ERROR ================"
            tail -n 120 build_apk.log
            echo "====================================================="
            echo "### Flutter Build APK Error:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 build_apk.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      # ─── Collect & Upload ──────────────────────────────────────────────────
      - name: Collect Built APK
        run: |
          mkdir -p apk_output
          find . -name "*.apk" -exec cp {} apk_output/ \;
          echo "### Collected APKs:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la apk_output/ | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Medication-Reminder-APK
          path: apk_output/*.apk
          if-no-files-found: error
